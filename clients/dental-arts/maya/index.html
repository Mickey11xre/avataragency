<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Maya's talking stage, EMBEDDED at the top of Dr. Alena Nawrocki's landing page (/clients/dental-arts/) through an
     iframe with microphone permission, so the stage's styles never touch the landing page's. Same script as /work and
     /avatarstages (avatarstages/maya-stage.js, demo panel: nothing is booked or sent). This page has no portfolio gate
     (Michael, 2026-10-09: anyone with the link can talk to her), so data-token points at the public, origin-checked
     /api/maya-nv2-token, and data-film plays the practice film through /clients/dental-arts/film/. Built from
     /clients/aharrison/lady-belle/. Unlisted: never link it elsewhere. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Maya | Dental Arts San Diego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/work/portfolio.css?v=9">
<link rel="stylesheet" href="/avatarstages/stages.css?v=8">
<script>
  (function (d) {
    var h = d.documentElement; h.className = h.className.replace('no-js', 'js');
    if ((window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || /[?&]rm=1/.test(location.search)) h.classList.add('rm');
  })(document);
</script>
<style>
  /* Sits at the top of the landing page: no header, no page padding, the landing page's cream background. */
  html, body { background: #F7F1E6 !important; margin: 0; padding: 0; overflow: hidden; }
  .embed-wrap { padding: 2px; }
  #maya-stage { scroll-margin-top: 0; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a.6.6 0 0 0 .9.5l10.4-6.5a.6.6 0 0 0 0-1L8.9 5a.6.6 0 0 0-.9.5z" fill="currentColor"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4 21L20 3" stroke="rgba(10,10,10,.9)" stroke-width="4" stroke-linecap="round"/><path d="M4 21L20 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13m-5-5.5L18.5 12 13 17.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="embed-wrap">
  <div class="stage" id="maya-stage" data-token="/api/maya-nv2-token" data-seen-path="/api"
       data-film="/clients/dental-arts/film/practice.mp4" data-film-poster="/clients/dental-arts/maya/practice-poster.webp">
    <div class="stage-av">
      <div id="maya-mount" class="ava-mount"></div>
      <video class="ava-video" muted loop playsinline preload="none" poster="/avatarstages/media/maya-poster.jpg?v=1" data-src="/avatarstages/media/maya-intro.mp4?v=2" aria-label="Maya, Dental Arts San Diego's AI assistant, introducing herself"></video>
      <div class="ava-badge"><span class="ava-dot"></span>Maya · AI assistant</div>
      <div class="ava-caption" aria-live="polite"></div>
      <div class="ava-toast" role="status" hidden></div>
      <button class="ava-sound" type="button" aria-pressed="false" aria-label="Play Maya's introduction with sound" title="Play Maya's introduction with sound"><svg aria-hidden="true"><use href="#i-sound-off"/></svg><span class="ava-sound-label" aria-hidden="true">Muted</span></button>
      <div class="ava-ctrls">
        <button class="ava-btn ava-talk" type="button"><svg><use href="#i-mic"/></svg><span>Talk to Maya</span></button>
      </div>
    </div>
    <aside class="panel is-home" id="maya-panel" aria-label="Maya's panel">
      <div class="panel-top">
        <button class="panel-back" type="button" hidden aria-label="Back"><svg><use href="#i-arrow"/></svg></button>
        <span class="panel-title">How can I help?</span>
        <span class="panel-flag" hidden>Demo</span>
      </div>
      <div class="panel-body" aria-live="polite"></div>
      <p class="panel-note">Prefer to type? Demo panel: nothing is booked or sent.</p>
    </aside>
  </div>
</div>

<script>
  /* Tell the landing page how tall this page is, so its iframe always fits the stage (it stacks on phones). */
  (function () {
    var last = 0;
    // Measure the stage itself: the document's own height would just echo the frame's height back.
    function send() { var w = document.querySelector(".embed-wrap"), h = Math.ceil(w ? w.getBoundingClientRect().height : document.documentElement.scrollHeight); if (h !== last) { last = h; try { parent.postMessage({ mayaStageHeight: h }, location.origin); } catch (e) {} } }
    if ("ResizeObserver" in window) new ResizeObserver(send).observe(document.body);
    window.addEventListener("load", send); window.addEventListener("resize", send); setTimeout(send, 300);
  })();
</script>
<script src="/avatarstages/maya-stage.js?v=6"></script>
</body>
</html>
