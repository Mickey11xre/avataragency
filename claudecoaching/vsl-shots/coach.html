<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSL Shot 12A — Coach On Call (voice)</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--cream:#FAF6F0;--ink:#211F1B;--ink-dim:rgba(33,31,27,.66);--line:rgba(33,31,27,.12);--accent:#D97757;
--display:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;--sans:'Inter',system-ui,sans-serif;--label:'Montserrat','Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--paper);font-family:var(--sans);color:var(--ink)}
.frame{width:100vw;height:100vh;display:flex;flex-direction:column;background:var(--paper)}
.bar{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--cream)}
.bar .dots{display:flex;gap:6px}
.bar .dots i{width:11px;height:11px;border-radius:50%;background:rgba(33,31,27,.18)}
.bar .title{font-family:var(--label);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.bar .title b{color:var(--accent)}
.shell{flex:1;display:flex;min-height:0;position:relative}
.side{flex:0 0 230px;background:var(--cream);border-right:1px solid var(--line);padding:18px 14px}
.side .new{display:block;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:.85rem;font-weight:600;padding:9px 12px;margin-bottom:16px}
.side .new b{color:var(--accent)}
.side .lbl{font-family:var(--label);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:9px}
.side ul{list-style:none}
.side li{font-size:.85rem;color:var(--ink-dim);padding:7px 9px;border-radius:6px}
.side li.on{background:rgba(217,119,87,.12);color:var(--ink)}
.main{flex:1;display:flex;flex-direction:column;padding:34px 44px 30px;min-width:0;position:relative}

/* live captions — video-call style, not chat */
.captions{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:16px;max-width:900px;width:100%;margin:0 auto;padding-bottom:8px}
.cap{background:rgba(33,31,27,.86);color:#fff;border-radius:12px;padding:13px 20px;font-size:1.06rem;line-height:1.5;max-width:82%;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.cap.show{opacity:1;transform:none}
.cap .who{font-family:var(--label);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:4px;color:rgba(255,255,255,.65)}
.cap.you{align-self:flex-end;background:rgba(217,119,87,.92)}
.cap.coach{align-self:flex-start}
.cap.coach .who{color:#F2B29B}

/* voice bar replaces text input */
.voicebar{max-width:900px;width:100%;margin:18px auto 0;display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:999px;padding:13px 22px;background:var(--paper)}
.voicebar .mic{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;position:relative}
.voicebar .mic svg{width:16px;height:16px;fill:#fff}
.voicebar .mic::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.voicebar .status{font-size:.92rem;color:var(--ink-dim)}
.voicebar .uwave{margin-left:auto;display:flex;gap:3px;align-items:flex-end;height:18px}
.voicebar .uwave i{width:3px;background:var(--accent);border-radius:2px;animation:uw 0.9s ease-in-out infinite}
.voicebar .uwave i:nth-child(2){animation-delay:.12s}.voicebar .uwave i:nth-child(3){animation-delay:.24s}
.voicebar .uwave i:nth-child(4){animation-delay:.36s}.voicebar .uwave i:nth-child(5){animation-delay:.48s}
.voicebar .uwave i:nth-child(6){animation-delay:.6s}.voicebar .uwave i:nth-child(7){animation-delay:.72s}
@keyframes uw{0%,100%{height:5px}50%{height:18px}}

/* coach window with REAL talking video */
.coach{position:absolute;top:26px;right:34px;width:360px;border-radius:14px;overflow:hidden;border:3px solid #fff;
  box-shadow:0 22px 54px rgba(33,31,27,.32);background:#141210;transform:scale(.05);opacity:0;transform-origin:top right;
  transition:transform .6s cubic-bezier(.2,.9,.3,1.15),opacity .4s;z-index:5}
.coach.show{transform:scale(1);opacity:1}
.coach .vid{position:relative}
.coach video{display:block;width:100%}
.coach .live{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);color:#C4372E;font-family:var(--label);font-size:.66rem;font-weight:700;letter-spacing:.1em;padding:5px 10px;border-radius:999px;opacity:0;transition:opacity .3s}
.coach .live.on{opacity:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.coach .name{position:absolute;bottom:10px;left:10px;color:#fff;background:rgba(33,31,27,.55);font-size:.74rem;font-weight:600;padding:5px 10px;border-radius:6px}
.coach .day{position:absolute;top:10px;right:10px;color:#fff;background:rgba(33,31,27,.6);font-family:var(--label);font-size:.62rem;font-weight:700;letter-spacing:.08em;padding:5px 9px;border-radius:6px}
.coach .wave{position:absolute;bottom:12px;right:12px;display:flex;gap:3px;align-items:flex-end;height:16px}
.coach .wave i{width:3px;background:var(--accent);border-radius:2px;animation:wv 1.1s ease-in-out infinite}
.coach .wave i:nth-child(2){animation-delay:.15s}.coach .wave i:nth-child(3){animation-delay:.3s}
.coach .wave i:nth-child(4){animation-delay:.45s}.coach .wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}
.coach .ctrl{display:flex;justify-content:center;gap:12px;padding:10px 0;background:#141210}
.coach .ctrl span{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.coach .ctrl svg{width:16px;height:16px;fill:#fff}
.coach .ctrl .hang{background:#D0342C}
</style>
</head>
<body>
<div class="frame">
  <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="title"><b>✳</b>&nbsp;Claude</span></div>
  <div class="shell">
    <aside class="side">
      <span class="new"><b>+</b> New chat</span>
      <div class="lbl">Chats</div>
      <ul>
        <li class="on">Talking with Coach Michael</li>
        <li>Monday morning brief</li>
        <li>Draft my follow-up emails</li>
        <li>Summarize meeting notes</li>
        <li>Plan next week's schedule</li>
      </ul>
    </aside>
    <div class="main">
      <div class="captions">
        <div class="cap you" id="cap1"><span class="who">You — speaking</span><span id="cap1text"></span></div>
        <div class="cap coach" id="cap2"><span class="who">Coach Michael — speaking</span><span id="cap2text"></span></div>
      </div>
      <div class="voicebar">
        <span class="mic"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></span>
        <span class="status" id="vstatus">Listening…</span>
        <span class="uwave" id="uwave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </div>

      <div class="coach" id="coach">
        <div class="vid">
          <video id="twinvid" src="twin_talking.mp4" muted playsinline preload="auto"></video>
          <span class="live" id="live">● LIVE</span>
          <span class="day" id="day">DAY 3 OF 30</span>
          <span class="name">Coach Michael</span>
          <span class="wave" id="cwave" style="opacity:0"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="ctrl">
          <span><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></span>
          <span><svg viewBox="0 0 24 24"><path d="M3 5h18v12h-7v2h3v2H7v-2h3v-2H3V5zm2 2v8h14V7H5zm7 1 3 3h-2v3h-2v-3h-2l3-3z"/></svg></span>
          <span class="hang"><svg viewBox="0 0 24 24"><path d="M12 9c-3.6 0-6.9 1.2-9.5 3.2a1 1 0 0 0-.2 1.4l1.7 2.2a1 1 0 0 0 1.3.3l2.8-1.4a1 1 0 0 0 .55-.9v-1.5a12.4 12.4 0 0 1 6.7 0v1.5a1 1 0 0 0 .55.9l2.8 1.4a1 1 0 0 0 1.3-.3l1.7-2.2a1 1 0 0 0-.2-1.4C18.9 10.2 15.6 9 12 9z"/></svg></span>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var coach=document.getElementById('coach'), live=document.getElementById('live'),
      day=document.getElementById('day'), cap1=document.getElementById('cap1'),
      cap1t=document.getElementById('cap1text'), cap2=document.getElementById('cap2'),
      cap2t=document.getElementById('cap2text'), vid=document.getElementById('twinvid'),
      cwave=document.getElementById('cwave'), vstatus=document.getElementById('vstatus'),
      uwave=document.getElementById('uwave');
  var Q="How do I make Claude remember my brand voice?";
  var A="Great question — let's set it up together, right now. Share your screen and I'll look at it with you.";
  function speakInto(el, text, wordMs, done){
    var words=text.split(' '), i=0;
    var t=setInterval(function(){ el.textContent=words.slice(0,++i).join(' '); if(i>=words.length){clearInterval(t); done&&done();} }, wordMs);
  }
  // Timeline: window in → LIVE → student SPEAKS (caption at speech pace) →
  // twin VIDEO plays (real lips) + twin caption + waveform → day counter ticks
  setTimeout(function(){ coach.classList.add('show'); }, 800);
  setTimeout(function(){ live.classList.add('on'); }, 1500);
  setTimeout(function(){
    cap1.classList.add('show');
    speakInto(cap1t, Q, 200, function(){
      vstatus.textContent='Coach is answering…';
      uwave.style.opacity='0.25';
      setTimeout(function(){
        try{ vid.play(); }catch(_){}
        cwave.style.opacity='1';
        cap2.classList.add('show');
        speakInto(cap2t, A, 210);
      }, 500);
    });
  }, 2100);
  setTimeout(function(){ day.textContent='DAY 17 OF 30'; }, 6800);
  setTimeout(function(){ day.textContent='DAY 29 OF 30'; }, 8600);
})();
</script>
</body>
</html>
