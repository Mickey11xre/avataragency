<style>
/* ================================================================
   THEME TOKENS
   ================================================================ */
:root {
  --bg:        #000;
  --text:      #e0e0e0;
  --text-paper: #f1ece0;
  --accent:    #c9a84c;
  --accent-hl: rgba(201, 168, 76, 0.28);
  --font-display: 'Instrument Serif', serif;
  --font-body:    'Outfit', sans-serif;
  --font-mono:    'JetBrains Mono', monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
}

html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }

/* ================================================================
   SLIDE SYSTEM
   ================================================================ */
.slide {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ================================================================
   FIXED UI CHROME
   ================================================================ */
.progress-bar {
  position: fixed; top: 0; left: 0; z-index: 200;
  height: 2px; background: var(--accent); width: 0;
  transition: width 0.4s var(--ease);
}

.nav-dots {
  position: fixed; right: 1.4rem; top: 50%; transform: translateY(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: 0.5rem;
}
.nav-dots button {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.2); border: none; cursor: pointer;
  transition: background 0.3s;
}
.nav-dots button.active { background: var(--accent); }

.slide-number {
  position: fixed; bottom: 1.4rem; right: 1.4rem; z-index: 200;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.3);
}

.nav-arrows {
  position: fixed; left: 1.4rem; top: 50%; transform: translateY(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: 0.5rem;
}
.nav-arrow {
  background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.45); width: 34px; height: 34px; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.nav-arrow:hover { background: rgba(0,0,0,0.75); color: var(--accent); }
.nav-arrow:disabled { opacity: 0.18; cursor: default; }
.nav-arrow svg { width: 15px; height: 15px; }

.watermark {
  position: fixed; bottom: 1.4rem; left: 1.4rem; z-index: 200;
  display: flex; align-items: center; gap: 0.45rem;
  color: rgba(255,255,255,0.28); font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
}
.watermark .bar { width: 1px; height: 13px; background: currentColor; }

.cursor-glow {
  position: fixed; pointer-events: none; z-index: 1;
  width: 300px; height: 300px; border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at center, rgba(201,168,76,0.045) 0%, transparent 70%);
}

/* ================================================================
   SLIDE 01 — COMPASSPLUS HERO
   ================================================================ */

/* Full-bleed background photo */
.slide-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center top;
  z-index: 0;
}

/* Subtle vignette: darkens bottom-right where Paul sits */
.slide-overlay {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    linear-gradient(to top,    rgba(0,0,0,0.55) 0%,   transparent 38%),
    linear-gradient(to left,   rgba(0,0,0,0.38) 0%,   transparent 55%),
    linear-gradient(to bottom, rgba(0,0,0,0.25) 0%,   transparent 28%);
}

/* ================================================================
   PAUL'S CORNER AVATAR — bottom-right
   ================================================================ */
.paul-corner {
  position: absolute;
  top:   clamp(8rem, 20vh, 14rem);  /* aligned with heading copy */
  right: clamp(2rem, 4.5vw, 5rem);
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.7rem;
}

.paul-avatar-wrap {
  width: clamp(260px, 27vw, 340px);
  display: flex;
  flex-direction: column;
  position: relative;   /* containing block for #paulMount's inset:0 */
  border-radius: 14px;
  overflow: hidden;
  background: #000;
  box-shadow:
    0 28px 72px rgba(0,0,0,0.75),
    0 0 0 1px rgba(255,255,255,0.12),
    inset 0 0 0 1px rgba(0,0,0,0.5);
  /* Creates a containing block for position:fixed SDK children (Chromium spec) */
  transform: translateZ(0);
  will-change: transform;
  isolation: isolate;
}

/* Video portion — maintains 16:10 ratio */
.paul-video-zone {
  width: 100%;
  aspect-ratio: 16 / 10;
  position: relative;
  flex-shrink: 0;
}

/* Controls slot — SDK control bar pins into this dark area below the video */
.paul-controls-zone {
  width: 100%;
  height: 90px;
  background: rgba(14, 14, 18, 0.94);
  position: relative;
  flex-shrink: 0;
}

.paul-poster {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}

/* "Talk to Paul" button overlaid on poster */
.paul-start-btn {
  position: absolute;
  bottom: 0.85rem;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: #0a0a0a;
  border: none;
  border-radius: 999px;
  padding: 0.42rem 1.1rem;
  font-family: var(--font-body);
  font-size: clamp(10.5px, 1.15vw, 12.5px);
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 5;
  transition: opacity 0.2s, transform 0.15s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.paul-start-btn:hover { opacity: 0.9; transform: translateX(-50%) translateY(-1px); }
.paul-start-btn svg { flex-shrink: 0; }

/* SDK mount — lives only in the video zone (16:10); prevents zoom/crop */
#paulMount {
  position: absolute; inset: 0;
  display: none;
  z-index: 5;
}

/* Dark strip that covers the SDK controls bar at the bottom of the video zone.
   Sits above #paulMount (z-index 6) so controls are hidden; matches the
   controls-zone colour below for a seamless dark area under Paul's face. */
.paul-controls-cover {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 72px;
  background: rgba(14, 14, 18, 0.97);
  z-index: 6;
  display: none;
}

/* Name badge below the avatar */
.paul-badge {
  background: rgba(0,0,0,0.68);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 999px;
  padding: 0.3rem 0.9rem;
  font-family: var(--font-mono);
  font-size: clamp(9px, 0.85vw, 10.5px);
  letter-spacing: 0.07em;
  color: rgba(255,255,255,0.65);
  white-space: nowrap;
}
.paul-badge strong { color: var(--accent); font-weight: 600; }

/* Live session indicator inside controls zone */
.paul-live-indicator {
  display: none;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 0.5rem;
  color: rgba(255,255,255,0.5);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.paul-live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #4ade80;
  flex-shrink: 0;
  animation: livePulse 1.6s ease-in-out infinite;
}
@keyframes livePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.3; transform: scale(0.8); }
}

/* Guard: Napster SDK injects transparent body style — keep bg black */
html, body { background: var(--bg) !important; }
</style>
</head>

<body>

  <!-- Full-bleed background: CompassPlus hero image -->
  <img

        <!-- Talk to Paul button -->

<!-- ================================================================
     Napster Companion SDK (standalone)
     ================================================================ -->
<script src="https://cdn.jsdelivr.net/npm/@touchcastllc/napster-companion-api@latest/lib/index.standalone.js"></script>

<script>
/* ================================================================
   SLIDE CONTROLLER (faithful port from the deck template)
   ================================================================ */
class SlidePresentation {
  constructor() {
    this.slides   = Array.from(document.querySelectorAll('.slide'));
    this.navDots  = document.getElementById('navDots');
    this.progressBar = document.getElementById('progressBar');
    this.currSpan = document.getElementById('slideCurr');
    this.totalSpan = document.getElementById('slideTotal');
    this.navPrev  = document.getElementById('navPrev');
    this.navNext  = document.getElementById('navNext');
    this.current  = 0;
    this.totalSpan.textContent = String(this.slides.length).padStart(2, '0');
    this.buildNavDots();
    this.attachObserver();
    this.attachKeyboard();
    this.attachTouch();
    this.attachArrows();
  }

  attachArrows() {
    if (this.navPrev) this.navPrev.addEventListener('click', () => this.goTo(this.current - 1));
    if (this.navNext) this.navNext.addEventListener('click', () => this.goTo(this.current + 1));
  }

  updateArrowState() {
    if (this.navPrev) this.navPrev.disabled = this.current <= 0;
    if (this.navNext) this.navNext.disabled = this.current >= this.slides.length - 1;
  }

  buildNavDots() {
    this.navDots.innerHTML = '';
    this.slides.forEach((slide, i) => {
      const btn = document.createElement('button');
      btn.setAttribute('aria-label', `Slide ${i + 1}: ${slide.dataset.title || ''}`);
      btn.addEventListener('click', () => this.goTo(i));
      this.navDots.appendChild(btn);
    });
  }

  attachObserver() {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.intersectionRatio < 0.55) return;
        entry.target.classList.add('visible');
        const i = this.slides.indexOf(entry.target);
        if (i !== -1) this.setCurrent(i);
      });
    }, { threshold: [0, 0.55, 0.9] });
    this.slides.forEach((s) => io.observe(s));
  }

  setCurrent(i) {
    this.current = i;
    [...this.navDots.children].forEach((b, j) => b.classList.toggle('active', j === i));
    this.currSpan.textContent = String(i + 1).padStart(2, '0');
    this.progressBar.style.width = ((i + 1) / this.slides.length * 100) + '%';
    this.updateArrowState();
  }

  goTo(i) {
    if (i < 0 || i >= this.slides.length) return;
    this.slides[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  attachKeyboard() {
    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input, textarea')) return;
      const keys = {
        'ArrowDown': 1, 'ArrowRight': 1, 'PageDown': 1, ' ': 1, 'j': 1,
        'ArrowUp': -1, 'ArrowLeft': -1, 'PageUp': -1, 'k': -1,
        'Home': -Infinity, 'End': Infinity,
      };
      if (e.key in keys) {
        e.preventDefault();
        const delta = keys[e.key];
        if (delta === -Infinity) this.goTo(0);
        else if (delta === Infinity) this.goTo(this.slides.length - 1);
        else this.goTo(this.current + delta);
      }
    });
  }

  attachTouch() {
    let startY = 0;
    document.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; }, { passive: true });
    document.addEventListener('touchend', (e) => {
      const diff = startY - e.changedTouches[0].clientY;
      if (Math.abs(diff) < 50) return;
      this.goTo(this.current + (diff > 0 ? 1 : -1));
    }, { passive: true });
  }
}

document.addEventListener('DOMContentLoaded', () => {
  new SlidePresentation();
  document.querySelector('.slide')?.classList.add('visible');
  initCursorGlow();
});

/* ================================================================
   Cursor glow
   ================================================================ */
function initCursorGlow() {
  const glow = document.getElementById('cursorGlow');
  if (!glow) return;
  let mx = window.innerWidth / 2, my = window.innerHeight / 2;
  let gx = mx, gy = my;
  document.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
  (function tick() {
    gx += (mx - gx) * 0.12;
    gy += (my - gy) * 0.12;
    glow.style.left  = gx + 'px';
    glow.style.top   = gy + 'px';
    requestAnimationFrame(tick);
  })();
}
</script>

<!-- Paul Small avatar — click-to-start -->
<script>
(function () {
  var startBtn   = document.getElementById('paulStart');
  var poster     = document.getElementById('paulPoster');
  var mount      = document.getElementById('paulMount');
  var paulWrap   = document.getElementById('paulWrap');
  if (!startBtn || !mount || !paulWrap) return;

  var started    = false;
  var instance   = null;
  var sdkBodyEls = [];  // elements the SDK injects directly into <body>

  /*
   * CTRL_H: approx height of the SDK control bar (px).
   * Used only when the body-level element contains the full video+controls
   * container (fallback path). In the normal path, the CSS transform trick
   * keeps the video inside #paulMount and sdkBodyEl is controls-only.
   */
  var CTRL_H = 90;

  function pinToFrame(el) {
    if (!el || !paulWrap) return;
    var r = paulWrap.getBoundingClientRect();

    if (el.querySelector('video, canvas')) {
      /* Full SDK container — pin to frame, clip controls off the bottom */
      el.style.cssText += [
        'position:fixed!important',
        'top:'    + r.top               + 'px!important',
        'left:'   + r.left              + 'px!important',
        'width:'  + r.width             + 'px!important',
        'height:' + (r.height + CTRL_H) + 'px!important',
        'clip-path:inset(0 0 ' + CTRL_H + 'px 0 round 14px)!important',
        'overflow:hidden!important',
        'z-index:20!important',
        'transform:none!important',
        'margin:0!important',
        'padding:0!important',
      ].join(';');
    } else {
      /* Controls-only overlay — pin it into the dedicated controls zone below the video */
      var zone = document.getElementById('paulControlsZone');
      var zr   = zone ? zone.getBoundingClientRect() : null;
      if (!zr) return;
      el.style.cssText += [
        'position:fixed!important',
        'top:'    + zr.top    + 'px!important',
        'left:'   + zr.left   + 'px!important',
        'width:'  + zr.width  + 'px!important',
        'height:' + zr.height + 'px!important',
        'border-radius:0!important',
        'overflow:hidden!important',
        'z-index:20!important',
        'transform:none!important',
        'margin:0!important',
        'padding:0!important',
        'display:block!important',
        'background:transparent!important',
      ].join(';');
    }
  }

  /* Re-pin all body-level elements on resize */
  window.addEventListener('resize', function () {
    sdkBodyEls.forEach(function (el) { pinToFrame(el); });
  });

  startBtn.addEventListener('click', async function () {
    if (started) return;
    started = true;
    startBtn.textContent = 'Connecting…';

    if (!document.getElementById('np-sdk-css')) {
      var lk = document.createElement('link');
      lk.id  = 'np-sdk-css';
      lk.rel = 'stylesheet';
      lk.href = 'https://cdn.jsdelivr.net/npm/@touchcastllc/napster-companion-api@latest/lib/index.css';
      document.head.appendChild(lk);
    }

    /* Watch for anything the SDK injects directly into <body> */
    var bodyObserver = new MutationObserver(function (records) {
      records.forEach(function (rec) {
        rec.addedNodes.forEach(function (node) {
          if (node.nodeType !== 1) return;
          if (paulWrap.contains(node) || node === paulWrap) return;
          sdkBodyEls.push(node);
        });
      });
    });
    bodyObserver.observe(document.body, { childList: true });

    try {
      var res = await fetch('https://avataragency.ai/api/paul-token');

      if (res.status === 503) {
        startBtn.textContent = 'Avatar being finalized — check back soon';
        started = false;
        bodyObserver.disconnect();
        return;
      }
      if (!res.ok) throw new Error('Token request failed: ' + res.status);

      var data = await res.json();
      var sdk  = window.napsterCompanionApiSDK || window.NapsterCompanionApiSdk;
      if (!sdk) throw new Error('Napster SDK not found');

      instance = await sdk.init(data.token, {
        mountContainer: '#paulMount',
        avatarStyle: { view: 'rectangle' }
      });
      instance.showAvatar();

      /* Switch from poster to live avatar */
      poster.style.display   = 'none';
      startBtn.style.display = 'none';
      mount.style.display    = 'block';

      /* Show live indicator in the dark zone below */
      var liveEl = document.getElementById('paulLiveIndicator');
      if (liveEl) liveEl.style.display = 'flex';

      /*
       * Fix SDK video layout — two problems to solve:
       * 1. Paul's head is cropped: SDK uses center crop on a portrait video inside
       *    our landscape container. Fix: object-position:top center on the <video>.
       * 2. Controls bar is visible: SDK renders buttons inside #paulMount. Fix:
       *    walk up from each button to its container (one that has no video/canvas)
       *    and hide it.
       * Retry up to 15× (3 s) in case the SDK renders asynchronously.
       */
      var fixAttempts = 0;
      function fixSdkLayout() {
        fixAttempts++;

        /* Anchor video crop to top so Paul's head is visible */
        mount.querySelectorAll('video').forEach(function (v) {
          v.style.setProperty('object-fit',       'cover',      'important');
          v.style.setProperty('object-position',  'top center', 'important');
        });

        /* Hide controls bar: from each button, walk up to the controls container */
        mount.querySelectorAll('button').forEach(function (btn) {
          var el = btn.parentElement;
          while (el && el !== mount) {
            if (!el.querySelector('video, canvas')) {
              el.style.setProperty('display', 'none', 'important');
              return;
            }
            el = el.parentElement;
          }
        });

        /* Fix any position:fixed elements inside the mount */
        mount.querySelectorAll('*').forEach(function (el) {
          if (window.getComputedStyle(el).position === 'fixed') {
            el.style.setProperty('position', 'absolute', 'important');
          }
        });

        /* Retry until video element appears */
        if (!mount.querySelector('video') && fixAttempts < 15) {
          setTimeout(fixSdkLayout, 200);
        }
      }

      /* Give SDK 600 ms to finish injecting body-level elements */
      setTimeout(function () {
        bodyObserver.disconnect();
        sdkBodyEls.forEach(function (el) { pinToFrame(el); });
      }, 600);

    } catch (err) {
