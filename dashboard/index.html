<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>Avatar dashboard · AvatarAgency</title>
<link rel="icon" href="/favicon.ico?v=1" sizes="48x48">
<link rel="icon" href="/favicon.png?v=1" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/assets/dashboard.css?v=1">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Dashboard menu">
    <a class="brand" href="#/overview"><b>Avatar<span>Agency</span></b><small>Avatar dashboard</small></a>
    <div style="position:relative">
      <button class="switcher" id="switcher" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="face"><img id="swImg" alt=""><span class="dot" aria-hidden="true"></span></span>
        <span class="who"><b id="swName">…</b><span id="swSub"></span></span>
        <svg class="i" id="swChev" hidden viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
      </button>
      <div class="menu" id="swMenu" hidden></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-route="overview"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Overview</a>
      <a href="#/leads" data-route="leads"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Leads<span class="count" data-newcount hidden></span></a>
      <a href="#/conversations" data-route="conversations"><svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Conversations</a>
      <a href="#/insights" data-route="insights"><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Insights</a>
      <a href="#/knowledge" data-route="knowledge"><svg class="i" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Knowledge</a>
      <a href="#/settings" data-route="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
    </nav>
    <div class="side-foot">
      <div class="me" id="me"></div>
      <button class="linkbtn" type="button" data-signout>Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="wrap">
      <header class="top">
        <div>
          <div class="crumb" id="crumb"></div>
          <h1 id="title">Overview</h1>
        </div>
        <div class="top-actions">
          <div class="range" id="range" role="group" aria-label="Time period">
            <button type="button" data-days="7">7 days</button>
            <button type="button" data-days="30">30 days</button>
            <button type="button" data-days="90">90 days</button>
            <button type="button" data-days="365">12 months</button>
          </div>
          <a class="btn dark" id="stageBtn" target="_blank" rel="noopener" aria-label="View live stage" title="View live stage"><svg class="i" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg><span>View <span class="long">live </span>stage</span></a>
        </div>
      </header>
      <section id="view" aria-live="polite"></section>
    </div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Dashboard sections">
    <a href="#/overview" data-route="overview"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Home</a>
    <a href="#/leads" data-route="leads"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Leads<span class="count" data-newcount hidden></span></a>
    <a href="#/conversations" data-route="conversations"><svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chats</a>
    <a href="#/insights" data-route="insights"><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Insights</a>
    <button type="button" id="moreBtn"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>More</button>
  </nav>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="More">
  <div class="grab"></div>
  <a href="#/knowledge" data-close><svg class="i" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Knowledge</a>
  <a href="#/settings" data-close><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</a>
  <a id="sheetStage" target="_blank" rel="noopener" data-close><svg class="i" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>View live stage</a>
  <button type="button" data-signout><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/dashboard/assets/dashboard.js?v=1" defer></script>
</body>
</html>
