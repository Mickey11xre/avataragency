<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>A message for you — AvatarAgency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A; --ink-2:#141414;
    --on-dark:#F5F0E8; --on-dark-mute:rgba(255,255,255,.56);
    --gold:#C9A84C; --gold-light:#E4C97A;
    --f:'General Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --f-serif:'Cormorant Garamond',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);min-height:100%}
  body{font-family:var(--f);color:var(--on-dark);display:flex;flex-direction:column;
       align-items:center;justify-content:center;min-height:100dvh;padding:28px 20px 34px;
       -webkit-font-smoothing:antialiased}

  .wrap{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center}
  .mark{font-size:10.5px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;
        color:var(--on-dark-mute);margin-bottom:22px}
  .mark span{color:var(--gold)}

  /* transform:translateZ(0) makes THIS the containing block for any position:fixed
     the SDK injects — trapping the live avatar inside the card (containment kit). */
  .stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;
         overflow:hidden;transform:translateZ(0);border:1px solid rgba(255,255,255,.09);
         box-shadow:0 40px 90px -40px rgba(0,0,0,.9)}
  #mount{position:absolute;inset:0;overflow:hidden}
  #mount>*,#mount video,#mount canvas{width:100%!important;height:100%!important;
        object-fit:cover;object-position:center 18%}
  #mount>*{position:absolute!important;inset:0!important;max-width:none!important;
        max-height:none!important;margin:0!important;border-radius:0!important}
  #mount,#mount *{overflow:hidden!important;scrollbar-width:none}

  /* poster — the twin's own source frame, so the still and the live avatar are the
     same shot. Sits under the hold pill and cross-fades out when the avatar is ready.
     Kept sharp (not blurred) and gently drifting: "here, not yet speaking" rather
     than "broken video player". */
  .poster{position:absolute;inset:0;z-index:1;opacity:1;transition:opacity .7s ease}
  .poster img{width:100%;height:100%;object-fit:cover;object-position:center 18%;
              display:block;filter:brightness(.86) saturate(.96);
              animation:drift 18s ease-in-out infinite alternate}
  .poster::after{content:'';position:absolute;inset:0;
                 background:radial-gradient(130% 100% at 50% 40%,transparent 52%,rgba(0,0,0,.5) 100%)}
  @keyframes drift{from{transform:scale(1.005)}to{transform:scale(1.055)}}
  .stage.ready .poster{opacity:0;pointer-events:none}

  /* hold pill — thin pulsating border, animated ellipsis, over the poster */
  /* lower third, subtitle position — never across the face */
  .hold{position:absolute;inset:0;display:grid;place-items:end center;padding:0 24px 30px;
        text-align:center;z-index:3}
  .pill{display:inline-block;padding:13px 22px;border-radius:999px;font-size:14.5px;
        font-weight:400;letter-spacing:.01em;color:var(--on-dark);
        background:rgba(255,255,255,.05);backdrop-filter:blur(8px);
        border:1px solid rgba(255,255,255,.9);animation:borderPulse 1.6s ease infinite}
  @keyframes borderPulse{
    0%,100%{border-color:rgba(255,255,255,.85);box-shadow:0 0 0 0 rgba(255,255,255,.12)}
    50%    {border-color:rgba(255,255,255,.28);box-shadow:0 0 0 7px rgba(255,255,255,0)}
  }
  .dots::after{content:'.';animation:dots 1.2s steps(1,end) infinite}
  @keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}

  /* tap-to-start fallback — only shown if autoplay/mic is blocked */
  .tap{position:absolute;inset:0;display:none;place-items:center;z-index:4;
       background:rgba(0,0,0,.55);backdrop-filter:blur(3px);cursor:pointer}
  .stage.needtap .tap{display:grid}
  .stage.needtap .hold{display:none}
  .tapbtn{display:inline-flex;align-items:center;gap:11px;padding:15px 26px;border:none;
          border-radius:999px;background:var(--gold);color:#1a1408;font-family:var(--f);
          font-size:15.5px;font-weight:600;letter-spacing:-.01em;cursor:pointer}
  .tapbtn svg{width:15px;height:15px;fill:#1a1408}

  .cap{margin-top:20px;text-align:center;min-height:22px}
  .cap p{font-family:var(--f-serif);font-style:italic;font-size:17px;color:var(--on-dark-mute)}
  .err{margin-top:20px;text-align:center;font-size:15px;line-height:1.6;color:var(--on-dark-mute)}
  .err a{color:var(--gold-light)}
  .disclose{margin-top:26px;font-size:11.5px;letter-spacing:.02em;color:rgba(255,255,255,.32);
            text-align:center;line-height:1.6}

  @media(max-width:640px){
    .stage{aspect-ratio:4/5}
    .pill{font-size:13.5px;padding:12px 18px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">Avatar<span>Agency</span></div>

  <div class="stage" id="stage">
    <div id="mount"></div>
    <div class="poster" id="poster">
      <img src="twin-poster.jpg" alt="" aria-hidden="true" decoding="async" fetchpriority="high">
    </div>
    <div class="hold" id="hold">
      <span class="pill" id="pill">Please hold<span class="dots"></span></span>
    </div>
    <div class="tap" id="tap">
      <button class="tapbtn" id="tapbtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        Tap to begin
      </button>
    </div>
  </div>

  <div class="cap" id="cap"></div>
  <div class="err" id="err" hidden></div>
  <p class="disclose">You are speaking with an AI digital twin of Michael Rivera, not the real person.</p>
</div>

<script>
(function () {
  'use strict';
  var ENDPOINT = '/api/meet-token';
  var SDK_URL = 'https://cdn.jsdelivr.net/npm/@touchcastllc/napster-companion-api@latest/lib/index.standalone.js';
  var CAP_S = 600; // 10-minute session cap

  var stage = document.getElementById('stage');
  var capEl = document.getElementById('cap');
  var errEl = document.getElementById('err');
  var pill  = document.getElementById('pill');
  var instance = null, sdkLoading = null, capTimer = null, readyTimer = null,
      stageTimer = null, done = false;

  var t = new URLSearchParams(location.search).get('t') || '';

  // The SDK injects `body,html{background:transparent}` at session start and never
  // removes it — capture the real backgrounds and re-assert them (background pin).
  var htmlBg = getComputedStyle(document.documentElement).backgroundColor;
  var bodyBg = getComputedStyle(document.body).backgroundColor;
  function pinBg() {
    document.documentElement.style.setProperty('background-color', htmlBg, 'important');
    document.body.style.setProperty('background-color', bodyBg, 'important');
  }

  function fail(msg, sub) {
    pinBg();
    stage.classList.remove('needtap');
    document.getElementById('hold').style.display = 'none';
    errEl.hidden = false;
    errEl.innerHTML = msg + (sub ? '<br><span style="opacity:.7">' + sub + '</span>' : '');
  }

  function loadSdk() {
    if (window.napsterCompanionApiSDK || window.NapsterCompanionApiSdk) return Promise.resolve();
    if (sdkLoading) return sdkLoading;
    sdkLoading = new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = SDK_URL; s.onload = res; s.onerror = rej;
      document.body.appendChild(s);
    });
    return sdkLoading;
  }

  // Cross-fade: poster out, live avatar in. The hold pill fades with it rather
  // than snapping away, so the handoff reads as one motion.
  function ready() {
    if (done) return;
    done = true;
    if (readyTimer) { clearTimeout(readyTimer); readyTimer = null; }
    if (stageTimer) { clearTimeout(stageTimer); stageTimer = null; }
    stage.classList.remove('needtap');
    stage.classList.add('ready');
    var hold = document.getElementById('hold');
    hold.style.transition = 'opacity .45s ease';
    hold.style.opacity = '0';
    setTimeout(function () { hold.style.display = 'none'; }, 500);
    pinBg();
  }

  // Give the wait a shape, so it never feels stalled.
  function stageMessages() {
    stageTimer = setTimeout(function () {
      if (!done) pill.innerHTML = 'Almost there<span class="dots"></span>';
    }, 5000);
  }

  async function start() {
    if (instance) return;
    try {
      await loadSdk();
      pinBg(); // the SDK injects `background:transparent` the moment it LOADS,
               // not at session start — re-assert immediately or the page goes white
      var res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t: t })
      });

      if (res.status === 404) { fail('This link isn&rsquo;t valid.', 'Check the link in your email, or reply and I&rsquo;ll send a new one.'); return; }
      if (res.status === 410) { fail('This link has expired.', 'Reply to the email and I&rsquo;ll send you a fresh one.'); return; }
      if (!res.ok) throw new Error('token ' + res.status);

      var data = await res.json();
      var sdk = window.napsterCompanionApiSDK || window.NapsterCompanionApiSdk;
      if (!sdk) throw new Error('sdk missing');

      pinBg();
      instance = await sdk.init(data.token, {
        mountContainer: '#mount',
        avatarStyle: { view: 'rectangle' },
        features: {
          showSDKLoader: { enabled: false },
          screenShare: { enabled: true },
          pictureInPicture: { enabled: true }
        },
        onAvatarReady: ready,
        onDestroy: function () { instance = null; }
      });
      instance.showAvatar();
      pinBg();

      // Fallback reveal — some browsers never fire onAvatarReady cleanly.
      setTimeout(function () { if (instance) ready(); }, 5000);

      capTimer = setTimeout(function () {
        if (instance) { try { instance.destroy && instance.destroy(); } catch (_) {} instance = null; }
        capEl.innerHTML = '<p>That&rsquo;s our time &mdash; reply to the email and let&rsquo;s talk properly.</p>';
      }, CAP_S * 1000);

      if (typeof gtag === 'function') gtag('event', 'meet_twin_session', { event_category: 'AVATAR_PROSPECTING' });
    } catch (e) {
      // Most likely: autoplay/mic blocked, or a locked-down corporate browser.
      // Offer the one gesture that unblocks everything.
      if (!instance) offerTap();
    }
  }

  function offerTap() {
    if (done) return;
    pinBg();
    stage.classList.add('needtap');
  }

  document.getElementById('tapbtn').addEventListener('click', function () {
    stage.classList.remove('needtap');
    var hold = document.getElementById('hold');
    hold.style.display = ''; hold.style.opacity = '1';
    pill.innerHTML = 'Connecting<span class="dots"></span>';
    instance = null;
    readyTimer = setTimeout(offerTap, 12000);
    stageMessages();
    start();
  });

  if (!t) {
    fail('This page is for personal invitations only.',
         'If you received a link from Michael, open it directly from your email.');
  } else {
    // Auto-start. If nothing is live after 9s, assume the browser blocked us and
    // fall back to a single tap — the gesture that unblocks audio and mic.
    readyTimer = setTimeout(offerTap, 9000);
    stageMessages();
    start();
  }
})();
</script>
<script>
/* Pin page background against the Napster SDK's body,html{background:transparent} injection.
   The SDK injects it when the SCRIPT LOADS, not at session start — so this guard is installed
   at page load. `html body` outranks the SDK's `body` selector regardless of source order. */
(function(){try{var h=getComputedStyle(document.documentElement),b=getComputedStyle(document.body),s=document.createElement('style');s.textContent='html{background-color:'+h.backgroundColor+' !important;background-image:'+h.backgroundImage+' !important}html body{background-color:'+b.backgroundColor+' !important;background-image:'+b.backgroundImage+' !important}';document.head.appendChild(s);}catch(e){}})();
</script>
</body>
</html>
