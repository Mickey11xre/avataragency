<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Branded App — white product shot</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 680px; height: 1030px; background: #FFFFFF; overflow: hidden; display: flex; align-items: center; justify-content: center; }

.phone {
  position: relative; width: 418px; height: 872px;
  background: #0A0A0A; border-radius: 62px; padding: 14px;
  transform: rotate(-7deg);
  box-shadow: 0 0 0 2px #2a2a2a inset, 28px 44px 70px -18px rgba(18,16,14,0.22), 10px 18px 28px -12px rgba(18,16,14,0.14);
}
.phone .screen { position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #fff; }
.phone iframe { width: 390px; height: 844px; border: 0; display: block; }
.island { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); width: 118px; height: 34px; background: #0A0A0A; border-radius: 20px; z-index: 5; }
.btn-side { position: absolute; background: #232323; border-radius: 3px; }
.btn-power { right: -3px; top: 240px; width: 4px; height: 96px; }
.btn-vol1 { left: -3px; top: 200px; width: 4px; height: 60px; }
.btn-vol2 { left: -3px; top: 272px; width: 4px; height: 60px; }
.btn-mute { left: -3px; top: 148px; width: 4px; height: 32px; }
</style>
</head>
<body>
  <div class="phone">
    <span class="btn-side btn-mute"></span><span class="btn-side btn-vol1"></span><span class="btn-side btn-vol2"></span><span class="btn-side btn-power"></span>
    <div class="screen">
      <div class="island"></div>
      <iframe src="app.html" scrolling="no"></iframe>
    </div>
  </div>
</body>
</html>
